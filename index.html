<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Orbit Explorer Quiz</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #edf2f7;
      --surface: #fbfdff;
      --surface-soft: #e5f4f6;
      --text: #142431;
      --muted: #607482;
      --border: #c9d8df;
      --accent: #087f91;
      --accent-dark: #05606e;
      --accent-soft: #dff2f4;
      --signal: #e09a37;
      --correct: #168a5b;
      --correct-soft: #dff8eb;
      --wrong: #c83d54;
      --wrong-soft: #ffeaee;
      --shadow: 0 18px 50px rgba(30, 66, 83, .14);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #0c151d;
        --surface: #14232d;
        --surface-soft: #19333b;
        --text: #e8f4f5;
        --muted: #91aab3;
        --border: #2b4651;
        --accent: #64d5d9;
        --accent-dark: #a0edef;
        --accent-soft: #173a42;
        --signal: #f0b858;
        --correct: #4ed39b;
        --correct-soft: #173c32;
        --wrong: #ff7184;
        --wrong-soft: #48232e;
        --shadow: 0 18px 50px rgba(0, 0, 0, .28);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      color: var(--text);
      background:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px) 0 0 / 100% 5px,
        radial-gradient(circle at 50% -10%, var(--accent-soft), transparent 34rem),
        var(--bg);
      font: 400 15px/1.55 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button { font: inherit; }

    .quiz {
      width: min(100%, 620px);
      margin: 0 auto;
      position: relative;
    }

    .masthead {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 26px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .masthead::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 72px;
      height: 3px;
      background: var(--signal);
      box-shadow: 0 0 14px color-mix(in srgb, var(--signal) 55%, transparent);
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-variant-numeric: tabular-nums;
    }

    h1, h2, p { margin-top: 0; }

    h1 {
      margin-bottom: 4px;
      font-size: clamp(26px, 7vw, 36px);
      line-height: 1.08;
      letter-spacing: -.04em;
    }

    .subtitle {
      margin-bottom: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .score-pill {
      flex: 0 0 auto;
      padding: 8px 12px;
      color: var(--accent);
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface-soft);
      font-size: 13px;
      font-weight: 750;
      box-shadow: 0 5px 18px rgba(48, 57, 91, .06);
      font-variant-numeric: tabular-nums;
    }

    .progress-block { margin-bottom: 18px; }

    .progress-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .03em;
      text-transform: uppercase;
    }

    .progress-track {
      height: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: var(--border);
    }

    .progress-bar {
      width: 10%;
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--accent), #50b6bd);
      box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 45%, transparent);
      transition: width .35s ease;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: var(--shadow);
      position: relative;
    }

    .card::before {
      content: "";
      display: block;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), transparent 72%);
    }

    .question-card { padding: clamp(22px, 5vw, 36px); }

    .question-number {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      margin-bottom: 13px;
      padding: 3px 10px;
      color: var(--accent);
      border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
      border-radius: 4px;
      background: var(--accent-soft);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .question {
      margin-bottom: 24px;
      font-size: clamp(21px, 5vw, 28px);
      line-height: 1.2;
      letter-spacing: -.025em;
    }

    .answers {
      display: grid;
      gap: 11px;
    }

    .answer {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 56px;
      padding: 13px 15px;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      background: color-mix(in srgb, var(--surface) 72%, var(--surface-soft));
      cursor: pointer;
      text-align: left;
      transition: border-color .2s, background .2s, transform .2s, color .2s;
    }

    .answer:hover:not(:disabled), .answer:focus-visible {
      border-color: var(--accent);
      background: var(--accent-soft);
      outline: none;
      transform: translateY(-1px);
    }

    .answer:disabled { cursor: default; }

    .answer-letter {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 27px;
      height: 27px;
      margin-right: 12px;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 50%;
      font-size: 12px;
      font-weight: 800;
    }

    .answer.correct {
      color: var(--correct);
      border-color: var(--correct);
      background: var(--correct-soft);
      animation: pop .35s ease;
    }

    .answer.correct .answer-letter {
      color: var(--correct);
      border-color: currentColor;
    }

    .answer.wrong {
      color: var(--wrong);
      border-color: var(--wrong);
      background: var(--wrong-soft);
      animation: shake .42s ease;
    }

    .answer.wrong .answer-letter {
      color: var(--wrong);
      border-color: currentColor;
    }

    .feedback {
      min-height: 27px;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .feedback.correct { color: var(--correct); }
    .feedback.wrong { color: var(--wrong); }

    .next-button, .restart-button {
      width: 100%;
      min-height: 50px;
      margin-top: 6px;
      color: #fff;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      cursor: pointer;
      font-weight: 800;
      transition: background .2s, transform .2s, box-shadow .2s;
      letter-spacing: .03em;
      text-transform: uppercase;
    }

    .next-button:hover, .restart-button:hover,
    .next-button:focus-visible, .restart-button:focus-visible {
      background: var(--accent-dark);
      outline: none;
      box-shadow: 0 8px 20px rgba(98, 87, 232, .25);
      transform: translateY(-1px);
    }

    .next-button:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    .results {
      padding: clamp(28px, 7vw, 48px) 25px;
      text-align: center;
    }

    .results-emoji {
      display: grid;
      place-items: center;
      width: 92px;
      height: 92px;
      margin: 0 auto 17px;
      border-radius: 8px;
      background: var(--accent-soft);
      font-size: 52px;
      animation: float 2.8s ease-in-out infinite;
    }

    .results h2 {
      margin-bottom: 7px;
      font-size: clamp(26px, 7vw, 36px);
      letter-spacing: -.035em;
    }

    .results-copy {
      max-width: 410px;
      margin: 0 auto 24px;
      color: var(--muted);
    }

    .final-score {
      margin-bottom: 22px;
      color: var(--accent);
      font-size: 44px;
      font-weight: 850;
      line-height: 1;
    }

    .hidden { display: none; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(3px); }
    }

    @keyframes pop {
      0% { transform: scale(.98); }
      60% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @media (max-width: 460px) {
      body { padding: 22px 12px; }
      .masthead { display: block; }
      .score-pill { display: inline-block; margin-top: 14px; }
      .question-card { padding: 22px 17px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="quiz">
    <header class="masthead">
      <div>
        <p class="eyebrow">Mission control</p>
        <h1>Orbit Explorer Quiz</h1>
        <p class="subtitle">Take a quick trip through our solar system.</p>
      </div>
      <div class="score-pill" aria-live="polite">Score: <span id="score">0</span></div>
    </header>

    <section class="progress-block" aria-label="Quiz progress">
      <div class="progress-label">
        <span id="progressText">Question 1 of 10</span>
        <span id="progressPercent">10%</span>
      </div>
      <div class="progress-track" role="progressbar" aria-valuemin="1" aria-valuemax="10" aria-valuenow="1" aria-label="Quiz progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </section>

    <section class="card question-card" id="questionView">
      <div class="question-number" id="questionNumber">Question 01</div>
      <h2 class="question" id="questionText"></h2>
      <div class="answers" id="answers"></div>
      <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
      <button class="next-button" id="nextButton" type="button" disabled>Choose an answer</button>
    </section>

    <section class="card results hidden" id="resultsView" aria-live="polite">
      <div class="results-emoji" id="resultsEmoji">🚀</div>
      <p class="eyebrow">Mission complete</p>
      <h2 id="resultsTitle">Stellar work!</h2>
      <p class="results-copy" id="resultsCopy"></p>
      <div class="final-score"><span id="finalScore">0</span><small>/10</small></div>
      <button class="restart-button" id="restartButton" type="button">Launch again</button>
    </section>
  </main>

  <script>
    const questions = [
      {
        question: "Which planet is known as the Red Planet?",
        answers: ["Venus", "Mars", "Jupiter", "Mercury"],
        correct: 1
      },
      {
        question: "What is the name of the galaxy that contains our solar system?",
        answers: ["Andromeda Galaxy", "Whirlpool Galaxy", "Milky Way", "Sombrero Galaxy"],
        correct: 2
      },
      {
        question: "Which planet has the most prominent ring system?",
        answers: ["Saturn", "Neptune", "Earth", "Uranus"],
        correct: 0
      },
      {
        question: "What is the closest star to Earth?",
        answers: ["Sirius", "Proxima Centauri", "The Sun", "Polaris"],
        correct: 2
      },
      {
        question: "How long does Earth take to orbit the Sun?",
        answers: ["24 hours", "7 days", "About 365 days", "About 30 days"],
        correct: 2
      },
      {
        question: "Which is the largest planet in our solar system?",
        answers: ["Jupiter", "Saturn", "Neptune", "Earth"],
        correct: 0
      },
      {
        question: "What force keeps planets in orbit around the Sun?",
        answers: ["Magnetism", "Gravity", "Friction", "Electricity"],
        correct: 1
      },
      {
        question: "Which planet is famous for its Great Red Spot?",
        answers: ["Mars", "Jupiter", "Venus", "Uranus"],
        correct: 1
      },
      {
        question: "What is a rocky object that enters Earth's atmosphere and burns up?",
        answers: ["Asteroid", "Comet", "Meteor", "Moon"],
        correct: 2
      },
      {
        question: "Which planet is farthest from the Sun?",
        answers: ["Uranus", "Neptune", "Saturn", "Pluto"],
        correct: 1
      }
    ];

    const questionView = document.getElementById("questionView");
    const resultsView = document.getElementById("resultsView");
    const questionNumber = document.getElementById("questionNumber");
    const questionText = document.getElementById("questionText");
    const answers = document.getElementById("answers");
    const feedback = document.getElementById("feedback");
    const nextButton = document.getElementById("nextButton");
    const restartButton = document.getElementById("restartButton");
    const score = document.getElementById("score");
    const progressText = document.getElementById("progressText");
    const progressPercent = document.getElementById("progressPercent");
    const progressBar = document.getElementById("progressBar");
    const progressTrack = document.querySelector(".progress-track");
    const finalScore = document.getElementById("finalScore");
    const resultsEmoji = document.getElementById("resultsEmoji");
    const resultsTitle = document.getElementById("resultsTitle");
    const resultsCopy = document.getElementById("resultsCopy");

    let currentQuestion = 0;
    let totalScore = 0;
    let answered = false;

    function renderQuestion() {
      const item = questions[currentQuestion];
      const number = currentQuestion + 1;
      const percent = Math.round((number / questions.length) * 100);

      questionNumber.textContent = `Question ${String(number).padStart(2, "0")}`;
      questionText.textContent = item.question;
      progressText.textContent = `Question ${number} of ${questions.length}`;
      progressPercent.textContent = `${percent}%`;
      progressBar.style.width = `${percent}%`;
      progressTrack.setAttribute("aria-valuenow", number);
      answers.innerHTML = "";
      feedback.textContent = "";
      feedback.className = "feedback";
      nextButton.disabled = true;
      nextButton.textContent = "Choose an answer";
      answered = false;

      item.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.dataset.index = index;
        button.innerHTML = `<span class="answer-letter">${String.fromCharCode(65 + index)}</span><span>${answer}</span>`;
        button.addEventListener("click", () => selectAnswer(index));
        answers.appendChild(button);
      });
    }

    function selectAnswer(selectedIndex) {
      if (answered) return;
      answered = true;
      const item = questions[currentQuestion];
      const answerButtons = [...answers.querySelectorAll(".answer")];
      const selectedButton = answerButtons[selectedIndex];
      const correctButton = answerButtons[item.correct];

      answerButtons.forEach(button => { button.disabled = true; });
      correctButton.classList.add("correct");

      if (selectedIndex === item.correct) {
        totalScore += 1;
        score.textContent = totalScore;
        feedback.textContent = "Correct! Your navigation is right on course. ✨";
        feedback.className = "feedback correct";
      } else {
        selectedButton.classList.add("wrong");
        feedback.textContent = `Not quite — the answer is ${item.answers[item.correct]}.`;
        feedback.className = "feedback wrong";
      }

      nextButton.disabled = false;
      nextButton.textContent = currentQuestion === questions.length - 1 ? "See my results" : "Next question";
    }

    function showResults() {
      questionView.classList.add("hidden");
      resultsView.classList.remove("hidden");
      finalScore.textContent = totalScore;

      if (totalScore === questions.length) {
        resultsEmoji.textContent = "🌟";
        resultsTitle.textContent = "Perfect orbit!";
        resultsCopy.textContent = "Every answer was on target. You are officially mission commander.";
      } else if (totalScore >= 7) {
        resultsEmoji.textContent = "🚀";
        resultsTitle.textContent = "Stellar work!";
        resultsCopy.textContent = "You know your way around the cosmos. Keep exploring!";
      } else if (totalScore >= 4) {
        resultsEmoji.textContent = "🛰️";
        resultsTitle.textContent = "Good flight!";
        resultsCopy.textContent = "You found some great answers. A little more stargazing will take you even farther.";
      } else {
        resultsEmoji.textContent = "🌙";
        resultsTitle.textContent = "Keep exploring!";
        resultsCopy.textContent = "Every space expert starts somewhere. Try again and chart a new course.";
      }
    }

    nextButton.addEventListener("click", () => {
      if (!answered) return;
      if (currentQuestion === questions.length - 1) {
        showResults();
      } else {
        currentQuestion += 1;
        renderQuestion();
      }
    });

    restartButton.addEventListener("click", () => {
      currentQuestion = 0;
      totalScore = 0;
      score.textContent = "0";
      resultsView.classList.add("hidden");
      questionView.classList.remove("hidden");
      renderQuestion();
    });

    renderQuestion();
  </script>
</body>
</html>
